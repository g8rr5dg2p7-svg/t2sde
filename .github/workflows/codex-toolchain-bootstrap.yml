name: Codex LTO bootstrap check

on:
  push:
    branches:
      - codex/t2sde-bootstrap-check
  workflow_dispatch:

jobs:
  toolchain-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash bc binutils bison build-essential bzip2 cpio curl diffutils \
            file findutils flex gawk gettext grep gzip libncurses-dev libtool-bin make \
            patch sed tar texinfo util-linux xz-utils zstd

      - name: Add ExactBuild support files used by luabash
        run: |
          set -euo pipefail
          mkdir -p misc/luabash/build
          curl -fsSL https://svn.exactcode.de/exact-build/trunk/build/top.make \
            -o misc/luabash/build/top.make
          curl -fsSL https://svn.exactcode.de/exact-build/trunk/build/bottom.make \
            -o misc/luabash/build/bottom.make
          curl -fsSL https://svn.exactcode.de/exact-build/trunk/build/Linux.make \
            -o misc/luabash/build/Linux.make

      - name: Create LTO bootstrap config
        run: |
          set -euo pipefail
          cfg=codex-lto-bootstrap
          mkdir -p "config/$cfg"
          cat > "config/$cfg/config" <<'EOF'
          export SDECFG_TARGET='generic'
          export SDECFG_ARCH='x86-64'
          export SDECFG_KERNEL='linux'
          export SDECFG_PKGSEL_TMPL='bootstrap'
          export SDECFG_LTO='1'
          export SDECFG_USE_CROSSCC='1'
          export SDECFG_TMPFS='0'
          export SDECFG_PARALLEL='2'
          export SDECFG_EXPERT='1'
          EOF
          : > "config/$cfg/packages"
          scripts/Config -cfg "$cfg" -oldconfig
          scripts/Config -cfg "$cfg" \
            PKGSEL_TMPL=bootstrap \
            LTO=1 \
            USE_CROSSCC=1 \
            TMPFS=0 \
            PARALLEL=2 \
            EXPERT=1
          scripts/Config -cfg "$cfg" -oldconfig
          scripts/Config -cfg "$cfg" TARGET ARCH KERNEL PKGSEL_TMPL LTO USE_CROSSCC TMPFS PARALLEL EXPERT
          grep '^X ' "config/$cfg/packages" | sed -n '1,200p'

      - name: Build full selected bootstrap
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.codex-root-home"/{cargo,rustup}
          timeout --foreground 330m sudo env \
            HOME="$GITHUB_WORKSPACE/.codex-root-home" \
            CARGO_HOME="$GITHUB_WORKSPACE/.codex-root-home/cargo" \
            RUSTUP_HOME="$GITHUB_WORKSPACE/.codex-root-home/rustup" \
            PATH="$PATH" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -lc 'cd "$GITHUB_WORKSPACE" && scripts/Build-Target -cfg codex-lto-bootstrap'

      - name: Summarize build logs
        if: always()
        run: |
          set -uo pipefail
          mkdir -p codex-t2-logs
          mapfile -t logs < <(
            find -P build \
              \( -path '*/proc' -o -path '*/dev' -o -path '*/sys' -o -path '*/TOOLCHAIN/loop' \) -prune -o \
              -path '*/var/adm/logs/*' -type f -print 2>/dev/null | sort
          )
          if ((${#logs[@]} == 0)); then
            echo "No T2 logs found."
            exit 0
          fi
          printf '%s\n' "${logs[@]}" | tail -n 80
          for log in "${logs[@]}"; do
            dest="codex-t2-logs/${log#build/}"
            mkdir -p "$(dirname "$dest")"
            sudo cp "$log" "$dest" 2>/dev/null || cp "$log" "$dest" 2>/dev/null || true
            sudo chown "$USER:$USER" "$dest" 2>/dev/null || true
          done
          find codex-t2-logs -type f | sort | sed -n '1,120p'
          for err in "${logs[@]}"; do
            case "$err" in
              *.err)
                err_dest="codex-t2-logs/${err#build/}"
                echo "===== $err ====="
                tail -n 120 "$err_dest" || true
                ;;
            esac
          done

      - name: Upload T2 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-toolchain-logs
          path: codex-t2-logs/**
          if-no-files-found: ignore
