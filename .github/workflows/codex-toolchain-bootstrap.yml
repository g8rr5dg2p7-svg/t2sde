name: Codex LTO bootstrap check

on:
  push:
    branches:
      - codex/t2sde-bootstrap-check
  workflow_dispatch:

jobs:
  toolchain-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash bc binutils bison build-essential bzip2 cpio curl diffutils \
            file findutils flex gawk gcc-14 g++-14 gettext gperf grep gzip libncurses-dev libtool-bin lzip make python3-pip \
            meson ninja-build patch pkgconf sed tar texinfo util-linux xz-utils zstd
          sudo python3 -m pip install --break-system-packages --upgrade 'meson>=1.4.0,<2.0'
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 140
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 140
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 140
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-14 140
          sudo rm -f \
            /usr/bin/ncurses5-config /usr/bin/ncurses6-config \
            /usr/bin/ncursesw5-config /usr/bin/ncursesw6-config
          meson --version
          gcc --version

      - name: Add ExactBuild support files used by luabash
        run: |
          set -euo pipefail
          mkdir -p misc/luabash/build
          curl -fsSL https://svn.exactcode.de/exact-build/trunk/build/top.make \
            -o misc/luabash/build/top.make
          curl -fsSL https://svn.exactcode.de/exact-build/trunk/build/bottom.make \
            -o misc/luabash/build/bottom.make
          curl -fsSL https://svn.exactcode.de/exact-build/trunk/build/Linux.make \
            -o misc/luabash/build/Linux.make

      - name: Create LTO bootstrap config
        run: |
          set -euo pipefail
          cfg=codex-lto-bootstrap
          mkdir -p "config/$cfg"
          cat > "config/$cfg/config" <<'EOF'
          export SDECFG_TARGET='generic'
          export SDECFG_ARCH='x86-64'
          export SDECFG_KERNEL='linux'
          export SDECFG_PKGSEL_TMPL='bootstrap'
          export SDECFG_LTO='1'
          export SDECFG_USE_CROSSCC='1'
          export SDECFG_TMPFS='0'
          export SDECFG_PARALLEL='2'
          export SDECFG_EXPERT='1'
          EOF
          sed -i 's/^#X perl$/X perl/' target/generic/pkgsel/10-bootstrap.in
          : > "config/$cfg/packages"
          scripts/Config -cfg "$cfg" -oldconfig
          scripts/Config -cfg "$cfg" \
            PKGSEL_TMPL=bootstrap \
            LTO=1 \
            USE_CROSSCC=1 \
            TMPFS=0 \
            PARALLEL=2 \
            EXPERT=1
          scripts/Config -cfg "$cfg" -oldconfig
          scripts/Config -cfg "$cfg" MULTILIB=0
          sed -i -E 's/^X ([^ ]+ [^ ]+ [^ ]+ base glibc32 )/O \1/' "config/$cfg/packages"
          scripts/Config -cfg "$cfg" TARGET ARCH KERNEL PKGSEL_TMPL LTO USE_CROSSCC TMPFS PARALLEL EXPERT
          scripts/Config -cfg "$cfg" MULTILIB
          grep '^X ' "config/$cfg/packages" | sed -n '1,200p'

      - name: Build full selected bootstrap
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.codex-root-home"/{cargo,rustup}
          timeout --foreground 330m sudo env \
            HOME="$GITHUB_WORKSPACE/.codex-root-home" \
            CARGO_HOME="$GITHUB_WORKSPACE/.codex-root-home/cargo" \
            RUSTUP_HOME="$GITHUB_WORKSPACE/.codex-root-home/rustup" \
            PATH="$PATH" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -lc 'cd "$GITHUB_WORKSPACE" && scripts/Build-Target -cfg codex-lto-bootstrap' &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            if sudo find -P build -path '*/var/adm/logs/*.err' -type f -print -quit 2>/dev/null | grep -q .; then
              echo "Detected package error log; stopping bootstrap so diagnostics upload immediately."
              kill -TERM "$build_pid" 2>/dev/null || true
              sleep 10
              kill -KILL "$build_pid" 2>/dev/null || true
              wait "$build_pid" || true
              exit 1
            fi
            sleep 30
          done
          wait "$build_pid"

      - name: Summarize build logs
        if: always()
        run: |
          set -uo pipefail
          mkdir -p codex-t2-logs
          mapfile -t logs < <(
            find -P build \
              \( -path '*/proc' -o -path '*/dev' -o -path '*/sys' -o -path '*/TOOLCHAIN/loop' \) -prune -o \
              -path '*/var/adm/logs/*' -type f -print 2>/dev/null | sort
          )
          mapfile -t config_logs < <(
            find -P . \
              \( -path './build/*/proc' -o -path './build/*/dev' -o -path './build/*/sys' -o -path './build/*/TOOLCHAIN/loop' \) -prune -o \
              -path './src.*/*/config.log' -type f -print 2>/dev/null | sort
          )
          logs+=("${config_logs[@]}")
          if ((${#logs[@]} == 0)); then
            echo "No T2 logs found."
            exit 0
          fi
          printf '%s\n' "${logs[@]}" | tail -n 80
          for log in "${logs[@]}"; do
            rel="${log#./}"
            rel="${rel#build/}"
            dest="codex-t2-logs/$rel"
            mkdir -p "$(dirname "$dest")"
            sudo cp "$log" "$dest" 2>/dev/null || cp "$log" "$dest" 2>/dev/null || true
            sudo chown "$USER:$USER" "$dest" 2>/dev/null || true
          done
          find codex-t2-logs -type f | sort | sed -n '1,120p'
          for err in "${logs[@]}"; do
            case "$err" in
              *.err)
                rel="${err#./}"
                rel="${rel#build/}"
                err_dest="codex-t2-logs/$rel"
                echo "===== $err ====="
                tail -n 120 "$err_dest" || true
                ;;
            esac
          done

      - name: Upload T2 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-toolchain-logs
          path: codex-t2-logs/**
          if-no-files-found: ignore
